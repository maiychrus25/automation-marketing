<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width={{width}}, height={{height}}" />
<script src="gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:{{width}}px;height:{{height}}px;overflow:hidden;background:#12060a}
:root{--accent:#ff2e4d;--on-accent:#fff;--u:1px;--safe-t:0px;--safe-b:0px;--pad:60px}
#root{position:relative;width:{{width}}px;height:{{height}}px;overflow:hidden;color:#fff;
  font-family:"Noto Sans","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 55%,#12060a) 0%,#12060a 70%)}
#rays{position:absolute;left:50%;top:50%;width:300%;height:300%;margin:-150% 0 0 -150%;opacity:.22;
  background:repeating-conic-gradient(from 0deg,#fff 0deg 7deg,transparent 7deg 22deg);mix-blend-mode:soft-light}
#layout{position:absolute;inset:0;display:flex;flex-direction:column;gap:calc(26*var(--u));
  padding:calc(var(--safe-t) + var(--pad)) var(--pad) calc(var(--safe-b) + var(--pad))}
#tag{align-self:flex-start;display:inline-flex;align-items:center;gap:calc(14*var(--u));font-weight:900;font-size:calc(46*var(--u));letter-spacing:.06em;
  padding:calc(10*var(--u)) calc(30*var(--u));background:#ffe14d;color:#1b0b10;border-radius:calc(14*var(--u));transform:skewX(-8deg)}
#title{font-weight:900;line-height:1.14;font-size:calc(88*var(--u));max-height:calc(300*var(--u));overflow:hidden;overflow-wrap:anywhere;text-wrap:balance;text-shadow:0 4px 24px rgba(0,0,0,.5)}
#stage{flex:1;min-height:0;position:relative}
#photo{position:absolute;inset:0;border-radius:calc(40*var(--u));overflow:hidden;background:#241015;border:calc(8*var(--u)) solid #ffe14d;box-shadow:0 calc(26*var(--u)) calc(80*var(--u)) rgba(0,0,0,.55)}
.slide{position:absolute;inset:0;visibility:hidden}
.slide img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#badge{position:absolute;right:calc(-8*var(--u));top:calc(-34*var(--u));width:calc(300*var(--u));height:calc(300*var(--u));display:flex;align-items:center;justify-content:center;z-index:4;
  background:#ffe14d;color:#1b0b10;font-weight:900;font-size:calc(104*var(--u));line-height:1;text-align:center;
  clip-path:polygon(50% 0,60% 12%,75% 6%,78% 22%,94% 25%,88% 40%,100% 50%,88% 60%,94% 75%,78% 78%,75% 94%,60% 88%,50% 100%,40% 88%,25% 94%,22% 78%,6% 75%,12% 60%,0 50%,12% 40%,6% 25%,22% 22%,25% 6%,40% 12%)}
#badge span{display:block;max-width:80%;white-space:nowrap}
#deal{display:flex;flex-direction:column;gap:calc(8*var(--u))}
#old{font-weight:700;font-size:calc(56*var(--u));color:rgba(255,255,255,.7);text-decoration:line-through;text-decoration-thickness:calc(5*var(--u));text-decoration-color:#ffe14d;white-space:nowrap;align-self:flex-start}
#price{font-weight:900;font-size:calc(176*var(--u));line-height:1;color:#ffe14d;white-space:nowrap;text-shadow:0 6px 40px rgba(255,225,77,.4);align-self:flex-start;transform-origin:0 60%}
#ends{align-self:flex-start;font-weight:800;font-size:calc(44*var(--u));padding:calc(12*var(--u)) calc(30*var(--u));border-radius:999px;border:calc(4*var(--u)) solid #ffe14d;color:#ffe14d;max-width:100%;overflow:hidden;white-space:nowrap}
#cta{text-align:center;font-weight:900;font-size:calc(64*var(--u));line-height:1.15;padding:calc(34*var(--u)) calc(48*var(--u));border-radius:calc(28*var(--u));
  background:var(--accent);color:var(--on-accent);border:calc(6*var(--u)) solid #ffe14d;box-shadow:0 calc(14*var(--u)) calc(44*var(--u)) color-mix(in srgb,var(--accent) 60%,transparent);
  max-height:calc(190*var(--u));overflow:hidden;overflow-wrap:anywhere}
#bottom,#top{flex:none;display:flex;flex-direction:column;gap:calc(26*var(--u))}
#root.port{--safe-t:190px;--safe-b:360px}
#root.sq{--pad:48px}
#root.sq #title{font-size:calc(66*var(--u));max-height:calc(190*var(--u))}
#root.sq #tag{font-size:calc(36*var(--u))}
#root.sq #price{font-size:calc(124*var(--u))}
#root.sq #old{font-size:calc(42*var(--u))}
#root.sq #ends{font-size:calc(34*var(--u))}
#root.sq #cta{font-size:calc(46*var(--u));padding:calc(22*var(--u)) calc(36*var(--u))}
#root.sq #badge{width:calc(230*var(--u));height:calc(230*var(--u));font-size:calc(78*var(--u))}
#root.land #layout{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr;gap:calc(56*var(--u))}
#root.land #left{display:flex;flex-direction:column;justify-content:center;gap:calc(26*var(--u));min-width:0}
#root.land #stage{min-width:0}
#root.land #title{font-size:calc(78*var(--u));max-height:calc(300*var(--u))}
#root.land #price{font-size:calc(150*var(--u))}
#root.land #badge{width:calc(250*var(--u));height:calc(250*var(--u));font-size:calc(86*var(--u))}
#left{display:contents}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="{{durationSec}}" data-width="{{width}}" data-height="{{height}}"
  data-composition-variables='{"title":{"type":"string","default":"Săn deal giá sốc hôm nay"},"oldPrice":{"type":"string","default":"599.000đ"},"price":{"type":"string","default":"299.000đ"},"discountLabel":{"type":"string","default":"-50%"},"endsText":{"type":"string","default":"Kết thúc 23:59 hôm nay"},"cta":{"type":"string","default":"Chốt đơn ngay"},"accent":{"type":"color","default":"#ff2e4d"},"durationSec":{"type":"number","default":20},"width":{"type":"number","default":1080},"height":{"type":"number","default":1920}}'>
{{audio}}
<div id="rays"></div>
<div id="layout" class="clip" data-start="0" data-duration="{{durationSec}}" data-track-index="0">
  <div id="left">
    <div id="top"><div id="tag">FLASH SALE</div><h1 id="title"></h1></div>
  </div>
  <div id="stage"><div id="photo"></div><div id="badge"><span id="disc"></span></div></div>
  <div id="bottom">
    <div id="deal"><div id="old"></div><div id="price"></div></div>
    <div id="ends"></div>
    <div id="cta"></div>
  </div>
</div>
</div>
<script>
const v = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
const W = v.width || 1080, H = v.height || 1920, D = v.durationSec || 20;
const $ = (id) => document.getElementById(id);
const images = Array.isArray(v.images) ? v.images : [];
$('root').classList.add(W > H ? 'land' : H > W ? 'port' : 'sq');
const u = Math.min(W, H) / 1080;
const rs = document.documentElement.style;
rs.setProperty('--u', u + 'px');
const accent = /^#[0-9a-f]{6}$/i.test(v.accent) ? v.accent : '#ff2e4d';
rs.setProperty('--accent', accent);
const lum = (parseInt(accent.slice(1, 3), 16) * 299 + parseInt(accent.slice(3, 5), 16) * 587 + parseInt(accent.slice(5, 7), 16) * 114) / 1000;
rs.setProperty('--on-accent', lum > 150 ? '#14161f' : '#ffffff');
if (W > H) { const left = $('left'); left.style.display = 'flex'; left.append($('bottom')); }

$('title').textContent = v.title || '';
$('old').textContent = v.oldPrice || '';
$('price').textContent = v.price || '';
$('disc').textContent = v.discountLabel || '';
$('ends').textContent = v.endsText || '';
$('cta').textContent = v.cta || '';
for (const [k, id] of [['title', 'title'], ['oldPrice', 'old'], ['price', 'price'], ['discountLabel', 'badge'], ['endsText', 'ends'], ['cta', 'cta']]) if (!v[k]) $(id).style.display = 'none';

function fit(el, minPx, maxW) {
  let size = parseFloat(getComputedStyle(el).fontSize);
  // Có maxW: chỉ xét chiều ngang (chữ một dòng). Không có: xét cả chiều cao khung (max-height) và chiều ngang.
  const over = () => (maxW ? el.scrollWidth > maxW + 1 : el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1);
  for (let i = 0; i < 40 && size > minPx && over(); i++) { size *= 0.94; el.style.fontSize = size + 'px'; }
}
images.forEach((src, i) => {
  const s = document.createElement('div'); s.className = 'slide'; s.id = 's' + i;
  const im = document.createElement('img'); im.alt = ''; im.src = src; s.appendChild(im); $('photo').appendChild(s);
});
const colW = $('bottom').clientWidth;
fit($('title'), 28 * u); fit($('cta'), 24 * u);
fit($('price'), 48 * u, colW); fit($('old'), 24 * u, colW); fit($('ends'), 20 * u, colW);
fit($('disc'), 24 * u, $('badge').clientWidth * 0.8);

const tl = gsap.timeline({ paused: true });
const n = images.length, per = D / Math.max(n, 1);
tl.fromTo('#rays', { rotation: 0 }, { rotation: 40, duration: D, ease: 'none' }, 0);
images.forEach((_, i) => {
  const sel = '#s' + i, t = i * per;
  tl.set(sel, { autoAlpha: 0 }, 0);
  tl.fromTo(sel, { autoAlpha: 0, scale: 1.18 }, { autoAlpha: 1, scale: 1.02, duration: 0.5, ease: 'power3.out' }, i === 0 ? 0 : t - 0.25);
  tl.to(sel, { scale: 1.1, duration: per + 0.25, ease: 'none' }, (i === 0 ? 0 : t - 0.25) + 0.5);
  if (i < n - 1) tl.to(sel, { autoAlpha: 0, duration: 0.4 }, t + per - 0.15);
});
tl.fromTo('#tag', { x: -300 * u, opacity: 0 }, { x: 0, opacity: 1, duration: 0.55, ease: 'back.out(1.6)' }, 0.1);
tl.fromTo('#title', { y: 50 * u, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: 'power3.out' }, 0.35);
tl.fromTo('#badge', { scale: 0, rotation: -60 }, { scale: 1, rotation: -8, duration: 0.8, ease: 'elastic.out(1,0.5)' }, 0.8);
tl.fromTo('#old', { opacity: 0, y: 30 * u }, { opacity: 1, y: 0, duration: 0.5 }, 1.3);
tl.fromTo('#price', { scale: 0.3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.7, ease: 'back.out(2.4)' }, 1.6);
tl.fromTo('#ends', { opacity: 0, y: 30 * u }, { opacity: 1, y: 0, duration: 0.5 }, 2.2);
tl.fromTo('#cta', { y: 90 * u, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: 'power3.out' }, 2.6);
const cyc = (len, from) => Math.max(1, Math.floor((D - from) / (2 * len)));
tl.to('#badge', { scale: 1.12, duration: 0.5, ease: 'sine.inOut', yoyo: true, repeat: 2 * cyc(0.5, 2) - 1 }, 2);
tl.to('#price', { scale: 1.05, duration: 0.6, ease: 'sine.inOut', yoyo: true, repeat: 2 * cyc(0.6, 3) - 1 }, 3);
tl.to('#cta', { scale: 1.05, duration: 0.45, ease: 'sine.inOut', yoyo: true, repeat: 2 * cyc(0.45, 3.4) - 1 }, 3.4);
window.__timelines = window.__timelines || {};
window.__timelines['main'] = tl;
tl.seek(0);
</script>
</body>
</html>
