<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width={{width}}, height={{height}}" />
<script src="gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:{{width}}px;height:{{height}}px;overflow:hidden;background:#0a0f12}
:root{--accent:#19c37d;--on-accent:#fff;--u:1px;--safe-t:0px;--safe-b:0px;--pad:64px}
#root{position:relative;width:{{width}}px;height:{{height}}px;overflow:hidden;color:#fff;
  font-family:"Noto Sans","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:linear-gradient(180deg,#0a0f12 0%,color-mix(in srgb,var(--accent) 22%,#0a0f12) 100%)}
#glow{position:absolute;left:50%;top:38%;width:130%;aspect-ratio:1;margin:-65% 0 0 -65%;border-radius:50%;
  background:radial-gradient(closest-side,color-mix(in srgb,var(--accent) 60%,transparent),transparent 70%);opacity:.7}
#layout{position:absolute;inset:0;display:flex;flex-direction:column;gap:calc(30*var(--u));
  padding:calc(var(--safe-t) + var(--pad)) var(--pad) calc(var(--safe-b) + var(--pad))}
#hero{flex:1;min-height:0;position:relative}
#frame{position:absolute;inset:0;border-radius:calc(48*var(--u));overflow:hidden;background:#10181c;
  box-shadow:0 calc(30*var(--u)) calc(90*var(--u)) rgba(0,0,0,.6),0 0 0 calc(3*var(--u)) color-mix(in srgb,var(--accent) 70%,transparent)}
.slide{position:absolute;inset:0;visibility:hidden}
.slide .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(calc(40*var(--u))) brightness(.55);transform:scale(1.3)}
.slide .kb{position:absolute;inset:0}
.slide .fg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:calc(20*var(--u))}
#title,#benefits,#buy{flex:none}
#title{font-weight:900;line-height:1.16;font-size:calc(94*var(--u));max-height:calc(300*var(--u));overflow:hidden;overflow-wrap:anywhere;text-wrap:balance;text-shadow:0 4px 24px rgba(0,0,0,.5)}
#benefits{list-style:none;display:flex;flex-direction:column;gap:calc(18*var(--u))}
#benefits li{display:flex;align-items:center;gap:calc(26*var(--u));font-weight:700;font-size:calc(50*var(--u));line-height:1.2;
  padding:calc(18*var(--u)) calc(28*var(--u));border-radius:calc(26*var(--u));background:rgba(255,255,255,.1);backdrop-filter:none;overflow:hidden}
#benefits .tick{flex:none;width:calc(64*var(--u));height:calc(64*var(--u));border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center}
#benefits .tick svg{width:62%;height:62%}
#benefits .txt{min-width:0;max-height:calc(120*var(--u));overflow:hidden;overflow-wrap:anywhere}
#buy{display:flex;align-items:center;gap:calc(28*var(--u))}
#price{flex:none;font-weight:900;font-size:calc(112*var(--u));line-height:1.05;color:var(--accent);white-space:nowrap;text-shadow:0 4px 30px color-mix(in srgb,var(--accent) 45%,transparent);transform-origin:0 50%}
#cta{flex:1;min-width:0;text-align:center;font-weight:900;font-size:calc(50*var(--u));line-height:1.15;padding:calc(30*var(--u)) calc(28*var(--u));border-radius:999px;
  background:var(--accent);color:var(--on-accent);box-shadow:0 calc(14*var(--u)) calc(44*var(--u)) color-mix(in srgb,var(--accent) 55%,transparent);max-height:calc(170*var(--u));overflow:hidden;overflow-wrap:anywhere}
#root.port{--safe-t:180px;--safe-b:340px}
#root.port #buy{flex-direction:column;align-items:stretch;gap:calc(22*var(--u))}
#root.port #price{align-self:flex-start}
#root.sq{--pad:48px}
#root.sq #layout{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr auto;column-gap:calc(40*var(--u));row-gap:calc(24*var(--u))}
#root.sq #title{grid-column:1/3;font-size:calc(64*var(--u));max-height:calc(150*var(--u))}
#root.sq #hero{grid-column:1;grid-row:2}
#root.sq #benefits{grid-column:2;grid-row:2;justify-content:center;gap:calc(14*var(--u))}
#root.sq #buy{grid-column:1/3;grid-row:3}
#root.sq #benefits li{font-size:calc(34*var(--u));padding:calc(12*var(--u)) calc(18*var(--u));gap:calc(16*var(--u))}
#root.sq #benefits .tick{width:calc(44*var(--u));height:calc(44*var(--u))}
#root.sq #benefits .txt{max-height:calc(90*var(--u))}
#root.sq #price{font-size:calc(88*var(--u))}
#root.sq #cta{font-size:calc(38*var(--u));padding:calc(20*var(--u))}
#root.land #layout{display:grid;grid-template-columns:44% 1fr;grid-template-rows:auto auto 1fr auto;column-gap:calc(56*var(--u));row-gap:calc(22*var(--u));padding-top:calc(var(--pad));padding-bottom:calc(var(--pad))}
#root.land #hero{grid-column:1;grid-row:1/5}
#root.land #title{grid-column:2;grid-row:1;font-size:calc(74*var(--u));max-height:calc(240*var(--u));align-self:end}
#root.land #benefits{grid-column:2;grid-row:2;gap:calc(14*var(--u))}
#root.land #benefits li{font-size:calc(40*var(--u))}
#root.land #buy{grid-column:2;grid-row:4;align-self:end}
#root.land #price{font-size:calc(96*var(--u))}
#root.land #cta{font-size:calc(42*var(--u))}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="{{durationSec}}" data-width="{{width}}" data-height="{{height}}"
  data-composition-variables='{"title":{"type":"string","default":"Serum vitamin C sáng da"},"benefit1":{"type":"string","default":"Sáng da sau 7 ngày"},"benefit2":{"type":"string","default":"Thấm nhanh, không bết dính"},"benefit3":{"type":"string","default":"Lành tính, hợp mọi loại da"},"price":{"type":"string","default":"259.000đ"},"cta":{"type":"string","default":"Đặt hàng ngay"},"accent":{"type":"color","default":"#19c37d"},"durationSec":{"type":"number","default":20},"width":{"type":"number","default":1080},"height":{"type":"number","default":1920}}'>
{{audio}}
<div id="glow"></div>
<div id="layout" class="clip" data-start="0" data-duration="{{durationSec}}" data-track-index="0">
  <h1 id="title"></h1>
  <div id="hero"><div id="frame"></div></div>
  <ul id="benefits"></ul>
  <div id="buy"><div id="price"></div><div id="cta"></div></div>
</div>
</div>
<script>
const v = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
const W = v.width || 1080, H = v.height || 1920, D = v.durationSec || 20;
const $ = (id) => document.getElementById(id);
const images = Array.isArray(v.images) ? v.images : [];
$('root').classList.add(W > H ? 'land' : H > W ? 'port' : 'sq');
const u = Math.min(W, H) / 1080;
const rs = document.documentElement.style;
rs.setProperty('--u', u + 'px');
const accent = /^#[0-9a-f]{6}$/i.test(v.accent) ? v.accent : '#19c37d';
rs.setProperty('--accent', accent);
const lum = (parseInt(accent.slice(1, 3), 16) * 299 + parseInt(accent.slice(3, 5), 16) * 587 + parseInt(accent.slice(5, 7), 16) * 114) / 1000;
rs.setProperty('--on-accent', lum > 150 ? '#14161f' : '#ffffff');

$('title').textContent = v.title || '';
$('price').textContent = v.price || '';
$('cta').textContent = v.cta || '';
if (!v.title) $('title').style.display = 'none';
if (!v.price) $('price').style.display = 'none';
if (!v.cta) $('cta').style.display = 'none';
const TICK = '<svg viewBox="0 0 24 24" fill="none" stroke="' + '#fff' + '" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const benefits = [v.benefit1, v.benefit2, v.benefit3].filter((b) => b && String(b).trim());
benefits.forEach((b, i) => {
  const li = document.createElement('li'); li.id = 'b' + i;
  li.innerHTML = '<span class="tick"></span><span class="txt"></span>';
  li.querySelector('.tick').innerHTML = TICK.replace('#fff', lum > 150 ? '#14161f' : '#fff');
  li.querySelector('.txt').textContent = b;
  $('benefits').appendChild(li);
});
if (!benefits.length) $('benefits').style.display = 'none';

function fit(el, minPx, maxW) {
  let size = parseFloat(getComputedStyle(el).fontSize);
  // Có maxW: chỉ xét chiều ngang (chữ một dòng). Không có: xét cả chiều cao khung (max-height) và chiều ngang.
  const over = () => (maxW ? el.scrollWidth > maxW + 1 : el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1);
  for (let i = 0; i < 40 && size > minPx && over(); i++) { size *= 0.94; el.style.fontSize = size + 'px'; }
}
images.forEach((src, i) => {
  const s = document.createElement('div'); s.className = 'slide'; s.id = 's' + i;
  s.innerHTML = '<img class="bg" alt=""><div class="kb"><img class="fg" alt=""></div>';
  s.querySelector('.bg').src = src; s.querySelector('.fg').src = src; $('frame').appendChild(s);
});
fit($('title'), 28 * u);
document.querySelectorAll('#benefits .txt').forEach((t) => fit(t, 18 * u));
fit($('cta'), 20 * u);
fit($('price'), 36 * u, $('buy').clientWidth * (H > W ? 1 : 0.55));

const tl = gsap.timeline({ paused: true });
const n = images.length, per = D / Math.max(n, 1);
tl.fromTo('#glow', { scale: 0.85 }, { scale: 1.15, duration: D, ease: 'none' }, 0);
images.forEach((_, i) => {
  const sel = '#s' + i, t = i * per, enter = i === 0 ? 0 : t - 0.4;
  tl.set(sel, { autoAlpha: 0 }, 0);
  tl.fromTo(sel, { autoAlpha: 0, scale: 0.9, y: 40 * u }, { autoAlpha: 1, scale: 1, y: 0, duration: 0.9, ease: 'power3.out' }, enter);
  tl.fromTo(sel + ' .kb', { scale: 1 }, { scale: 1.08, duration: per + 0.6, ease: 'none' }, enter);
  if (i < n - 1) tl.to(sel, { autoAlpha: 0, duration: 0.5 }, t + per - 0.1);
});
tl.fromTo('#title', { y: -40 * u, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: 'power3.out' }, 0.2);
benefits.forEach((_, i) => tl.fromTo('#b' + i, { x: -120 * u, opacity: 0 }, { x: 0, opacity: 1, duration: 0.6, ease: 'power3.out' }, 1.4 + i * 0.5));
tl.fromTo('#price', { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.7, ease: 'back.out(2.2)' }, 3.2);
tl.fromTo('#cta', { x: 80 * u, opacity: 0 }, { x: 0, opacity: 1, duration: 0.6, ease: 'power3.out' }, 3.5);
const cycles = Math.max(1, Math.floor((D - 5) / 1.3));
tl.to('#cta', { scale: 1.04, duration: 0.65, ease: 'sine.inOut', yoyo: true, repeat: 2 * cycles - 1 }, 4.3);
window.__timelines = window.__timelines || {};
window.__timelines['main'] = tl;
tl.seek(0);
</script>
</body>
</html>
