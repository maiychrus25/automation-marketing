<!--
  MaiHub — dấu hiệu nhận diện. ĐÂY LÀ FILE GỐC DUY NHẤT.

  Mọi file .png/.ico/.icns trong thư mục này đều được dựng ra từ đây bằng
  `node scripts/build-icons.mjs`. Sửa logo thì sửa file này rồi chạy lại
  script — đừng sửa tay file ảnh, lần dựng sau sẽ ghi đè.

  Ý TƯỞNG
  Một bông hoa mai năm cánh: "Mai" trong MaiHub, và năm cánh tỏa từ một tâm là
  "hub" — một nơi, nhiều kênh. Cánh hoa là năm hình tròn chồng lên nhau nên ở
  cỡ 16px (icon khay hệ thống) vẫn còn là một khối hoa đặc, nhụy là một chấm
  màu nền ở giữa.

  VÌ SAO ĐẶT TỈ LỆ NHƯ VẬY
  - Tâm cánh cách tâm hoa 23 đơn vị, bán kính cánh 18,5: cánh kề nhau chồng
    lên nhau đủ để không hở khe ở cỡ nhỏ, vẫn còn rãnh giữa các cánh ở cỡ lớn.
  - Nhụy bán kính 8 cùng màu nền: ở cỡ nhỏ nhụy co lại thành một chấm, hoa
    không bị thành một đĩa trắng vô nghĩa.
  - Hoa chạm mép nền ở khoảng 8,5 đơn vị, giống khoảng thở của logo cũ.

  Lớp chấm báo tin chưa đọc (`.unread-badge`) mặc định ẩn. Script dựng bật nó
  lên để tạo bộ `icon_dot.*`. Nhờ vậy chỉ có một bản hình duy nhất, hai biến
  thể không thể lệch nhau.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="maihubBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E40AF"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <style>.unread-badge { display: none; }</style>
  </defs>

  <!-- Nền bo tròn 22% - cùng tỉ lệ bo với icon ứng dụng hiện đại -->
  <rect width="100" height="100" rx="22" ry="22" fill="url(#maihubBg)"/>

  <!-- Năm cánh hoa mai -->
  <g fill="#FFFFFF">
    <circle cx="50.00" cy="27.00" r="18.5"/>
    <circle cx="71.87" cy="42.89" r="18.5"/>
    <circle cx="63.52" cy="68.61" r="18.5"/>
    <circle cx="36.48" cy="68.61" r="18.5"/>
    <circle cx="28.13" cy="42.89" r="18.5"/>
  </g>
  <!-- Nhụy: chấm màu nền -->
  <circle cx="50" cy="50" r="8" fill="#1E40AF"/>

  <!-- Chấm báo tin chưa đọc. Vòng ngoài cùng màu nền để tách chấm khỏi hoa
       khi hai hình chạm nhau ở các cỡ nhỏ. -->
  <g class="unread-badge">
    <circle cx="80" cy="20" r="15" fill="#1E40AF"/>
    <circle cx="80" cy="20" r="12.5" fill="#EF4444"/>
  </g>
</svg>
