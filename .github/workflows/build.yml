# Build bản cài MaiHub cho Linux, Windows và macOS.
#
# Chạy: tab Actions → "Build" → Run workflow (chọn nhánh), hoặc đẩy tag `v*`.
# Kết quả: mục Artifacts của lần chạy (giữ 14 ngày).
# Phát hành: tick "Tạo Release" khi Run workflow (tag lấy từ version trong package.json),
# hoặc đẩy tag `v*` → job "Phát hành" tạo GitHub Release kèm toàn bộ bản cài.
# Repo công khai; Release kèm latest*.yml và *.blockmap để app tự cập nhật (electron-updater).
#
# Mỗi hệ điều hành build trên runner của chính nó, nên các thành phần native
# (better-sqlite3, ffmpeg-static, @ngrok/ngrok, cloudflared, cầu nối Go E2EE)
# luôn đúng nền tảng và kiến trúc. Không build chéo.
name: Build

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Tạo Release (tag v<version trong package.json>) sau khi build xong'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  # tsc kiểm kiểu renderer cần khoảng 2,4 GB heap (2.300 file, gồm cả kiểu của googleapis);
  # trần mặc định của Node trên runner khoảng 2 GB nên bị "heap out of memory".
  # 4 GB vừa với runner ít RAM nhất (macOS Apple Silicon, 7 GB).
  NODE_OPTIONS: --max-old-space-size=4096

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Kiểm tra (tsc + jest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Tải binary Electron/native đôi khi bị 500 từ máy chủ phân phối → thử lại tối đa 3 lần.
      - name: Cài dependency
        shell: bash
        run: |
          for i in 1 2 3; do
            npm ci && break
            echo "npm ci thất bại (lần $i), thử lại sau 20 giây..."
            rm -rf node_modules
            sleep 20
            [ "$i" = 3 ] && exit 1
          done

      - name: In giới hạn heap của Node
        run: node -e "console.log('heap limit MB:', Math.round(require('v8').getHeapStatistics().heap_size_limit / 1048576))"

      # Gọi tsc qua node với cờ heap tường minh, không phụ thuộc NODE_OPTIONS.
      - name: Type-check main process
        run: node --max-old-space-size=4096 node_modules/typescript/bin/tsc -p tsconfig.electron.json --noEmit

      - name: Type-check renderer
        run: node --max-old-space-size=4096 node_modules/typescript/bin/tsc -p tsconfig.json --noEmit

      - name: Unit test
        run: npx jest --runInBand

  package:
    name: Đóng gói ${{ matrix.name }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-latest
            builder_args: --linux AppImage deb --x64
          - name: windows-x64
            runner: windows-latest
            builder_args: --win nsis --x64
          - name: macos-arm64
            runner: macos-latest
            builder_args: --mac dmg zip --arm64
          - name: macos-x64
            runner: macos-15-intel
            builder_args: --mac dmg zip --x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version-file: src/bridge-e2ee/go.mod
          cache-dependency-path: src/bridge-e2ee/go.sum

      # Tải binary Electron/native đôi khi bị 500 từ máy chủ phân phối → thử lại tối đa 3 lần.
      - name: Cài dependency
        shell: bash
        run: |
          for i in 1 2 3; do
            npm ci && break
            echo "npm ci thất bại (lần $i), thử lại sau 20 giây..."
            rm -rf node_modules
            sleep 20
            [ "$i" = 3 ] && exit 1
          done

      # Thư mục build/ của cầu nối đang chứa sẵn một bản .exe cũ (và file backup .exe~)
      # trong repo; xóa để gói chỉ mang đúng binary vừa build cho nền tảng này.
      - name: Dọn binary cầu nối E2EE cũ
        shell: bash
        run: rm -f src/bridge-e2ee/build/*

      - name: Build cầu nối E2EE (Go)
        run: npm run build:bridge-e2ee

      - name: Build main process
        run: npx tsc -p tsconfig.electron.prod.json

      - name: Gỡ console.* khỏi main process
        run: node scripts/strip-console.js

      - name: Build renderer
        run: npm run build:renderer

      - name: Build better-sqlite3 cho Electron
        run: npm run rebuild:native

      # macOS: chưa có chứng chỉ Apple → ký ad-hoc (`identity=-`) để app chạy được trên
      # Apple Silicon; Gatekeeper vẫn cảnh báo lần mở đầu (xem README).
      - name: Đóng gói (electron-builder)
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          extra=""
          if [ "${{ runner.os }}" = "macOS" ]; then extra="-c.mac.identity=-"; fi
          npx electron-builder ${{ matrix.builder_args }} --publish never $extra

      # Hai job macOS cùng sinh latest-mac.yml; chỉ giữ bản của arm64 để không ghi đè nhau khi gộp.
      # macOS chưa ký số nên chỉ dùng tệp này để biết số phiên bản, không tự cài.
      - name: Bỏ latest-mac.yml của bản Intel
        if: matrix.name == 'macos-x64'
        shell: bash
        run: rm -f dist-electron-build/latest-mac.yml

      # latest*.yml và *.blockmap là tệp mô tả phiên bản mà electron-updater đọc để tự cập nhật
      # (xem docs/specs/2026-10-03-auto-update.md).
      - name: Tải lên bản cài
        uses: actions/upload-artifact@v4
        with:
          name: maihub-${{ matrix.name }}
          path: |
            dist-electron-build/*.AppImage
            dist-electron-build/*.deb
            dist-electron-build/*.exe
            dist-electron-build/*.dmg
            dist-electron-build/*.zip
            dist-electron-build/latest*.yml
            dist-electron-build/*.blockmap
          if-no-files-found: error
          retention-days: 14

  release:
    name: Phát hành
    needs: package
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Xác định tag phát hành
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          fi

      - name: Tải các bản cài vừa build
        uses: actions/download-artifact@v4
        with:
          pattern: maihub-*
          path: release-files
          merge-multiple: true

      - name: Liệt kê bản cài
        run: ls -la release-files

      - name: Tạo GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: MaiHub ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-files/*
